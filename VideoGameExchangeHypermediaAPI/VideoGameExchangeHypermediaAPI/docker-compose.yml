version: '3.9'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - videogameexchange-api
    networks:
      - backend

  videogameexchange-api:
    build:
      context: ../
      dockerfile: VideoGameExchangeHypermediaAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=VideoGameExchangeDb;User=sa;Password=Your_strong_password123;TrustServerCertificate=True;
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "8080"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_strong_password123
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - backend
    restart: unless-stopped

volumes:
  sql_data:

networks:
  backend:
    driver: bridge
